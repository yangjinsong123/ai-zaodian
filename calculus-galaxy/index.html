<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<!-- 打包版：双击即可打开。开发请用 dev.html（需要本地服务器 + npm install） -->
<title>calculus-galaxy · 一元微积分知识星图</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="stage"></div>
<div id="hint">拖动旋转 · 滚轮缩放飞进去 · 点一颗星看卡片</div>
<svg id="leader"><line x1="0" y1="0" x2="0" y2="0"/><circle r="5"/></svg>
<div id="tap"></div>
<div id="card">
  <div class="c-chap"></div>
  <div class="c-title"></div>
  <ul class="c-bullets"></ul>
  <div class="c-close">×</div>
</div>
<div id="cursor"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.6 L11 13.8 L18 13.8 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="wheel"></div></div>
<div id="code"><div class="tab">knowledge.json</div><pre class="src"></pre></div>
<script src="./data/knowledge.js"></script>
<script src="./dist/calculus-galaxy.js"></script>
</body>
</html>
